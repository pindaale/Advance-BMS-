plugins {
    id 'com.android.application'
}

android {
    namespace 'com.universalbms.pro'
    compileSdk 33

    defaultConfig {
        applicationId "com.universalbms.pro"
        minSdk 26
        targetSdk 33
        versionCode 4
        versionName "4.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
