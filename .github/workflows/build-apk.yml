name: Build Universal BMS Pro Android 13 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Android 13 Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare Universal-BMS-Pro-Android13.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk Universal-BMS-Pro-Android13.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-BMS-Pro-Android13.apk
          path: Universal-BMS-Pro-Android13.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 Universal-BMS-Pro-Android13.apk --clobber
          else
            gh release create v1.0.0 Universal-BMS-Pro-Android13.apk --title "Universal BMS Pro v1.0.0 (Android 13)" --notes "Automated Android 13 (targetSdk 33) APK build"
          fi
